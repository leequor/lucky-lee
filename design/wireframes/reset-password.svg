<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Reset password wireframe</title>
  <desc id="desc">Low-fidelity set-a-new-password layout with two password fields and an expired-link state note.</desc>
  <rect width="1280" height="800" fill="#F5F5F3"/>
  <text x="64" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#6B7280">WIREFRAME / RESET PASSWORD</text>
  <text x="64" y="64" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Desktop 1280 x 800 / recovery session</text>

  <rect x="64" y="104" width="28" height="28" rx="8" fill="#D1D5DB"/>
  <text x="104" y="124" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#374151">LUCKY PATCHER</text>

  <rect x="64" y="196" width="380" height="24" rx="6" fill="#D1D5DB"/>
  <rect x="64" y="234" width="300" height="24" rx="6" fill="#D1D5DB"/>
  <rect x="64" y="282" width="430" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="64" y="302" width="350" height="10" rx="5" fill="#E5E7EB"/>

  <circle cx="80" cy="376" r="16" fill="#E5E7EB"/>
  <text x="75" y="381" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6B7280">01</text>
  <rect x="112" y="364" width="190" height="10" rx="5" fill="#D1D5DB"/>
  <rect x="112" y="384" width="320" height="8" rx="4" fill="#E5E7EB"/>

  <circle cx="80" cy="448" r="16" fill="#E5E7EB"/>
  <text x="75" y="453" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6B7280">02</text>
  <rect x="112" y="436" width="150" height="10" rx="5" fill="#D1D5DB"/>
  <rect x="112" y="456" width="300" height="8" rx="4" fill="#E5E7EB"/>

  <rect x="64" y="560" width="426" height="90" rx="16" fill="none" stroke="#D1D5DB" stroke-dasharray="6 6"/>
  <text x="84" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6B7280">EXPIRED OR USED LINK</text>
  <rect x="84" y="606" width="250" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="84" y="622" width="210" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="350" y="592" width="120" height="36" rx="18" fill="#E5E7EB"/>
  <text x="368" y="615" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6B7280">REQUEST NEW</text>

  <rect x="720" y="98" width="496" height="604" rx="28" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="760" y="142" width="84" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="760" y="176" width="286" height="26" rx="6" fill="#D1D5DB"/>
  <rect x="760" y="218" width="410" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="760" y="238" width="330" height="10" rx="5" fill="#E5E7EB"/>

  <rect x="760" y="294" width="100" height="10" rx="5" fill="#D1D5DB"/>
  <rect x="1040" y="294" width="136" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="760" y="316" width="416" height="54" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="5 5"/>
  <text x="780" y="348" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Enter a new password</text>

  <rect x="760" y="402" width="136" height="10" rx="5" fill="#D1D5DB"/>
  <rect x="760" y="424" width="416" height="54" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="5 5"/>
  <text x="780" y="456" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Type it again</text>

  <rect x="760" y="516" width="416" height="54" rx="27" fill="#D1D5DB"/>
  <text x="912" y="548" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280">UPDATE PASSWORD</text>

  <rect x="760" y="606" width="416" height="1" fill="#E5E7EB"/>
  <rect x="830" y="632" width="276" height="10" rx="5" fill="#E5E7EB"/>

  <rect x="740" y="748" width="456" height="30" rx="15" fill="none" stroke="#D1D5DB" stroke-dasharray="5 5"/>
  <text x="762" y="768" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Do not render the form when the recovery session is missing</text>
</svg>
