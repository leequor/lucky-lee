<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Login wireframe</title>
  <desc id="desc">Low-fidelity two-column login layout with a brand panel and an email and password card.</desc>
  <rect width="1280" height="800" fill="#F5F5F3"/>
