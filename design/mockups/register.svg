<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Lucky Patcher register mockup</title>
  <desc id="desc">Final register design: a warm cream auth shell and a three-field account creation card.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1C2321" stroke-opacity="0.055"/>
    </pattern>
    <filter id="cardShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1C2321" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#BBF7D0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#BBF7D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFEDD5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFEDD5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#F7F3EA"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <circle cx="180" cy="150" r="230" fill="url(#glowGreen)"/>
  <circle cx="1130" cy="720" r="260" fill="url(#glowCoral)"/>

  <g transform="translate(80 62)">
    <rect width="44" height="44" rx="14" fill="#14532D"/>
    <g fill="#DCFCE7">
      <circle cx="15" cy="15" r="7"/>
      <circle cx="29" cy="15" r="7"/>
      <circle cx="15" cy="29" r="7"/>
      <circle cx="29" cy="29" r="7"/>
    </g>
    <path d="M22 22V38" stroke="#166534" stroke-width="2.4" stroke-linecap="round"/>
    <text x="58" y="29" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="600" fill="#1C2321">Lucky Patcher</text>
  </g>

  <text x="80" y="194" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#166534">SPRINT 1 / ACCOUNT ACCESS</text>
  <text x="78" y="270" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="600" fill="#1C2321">A calmer way to</text>
  <text x="78" y="330" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="600" fill="#1C2321">get everyone in.</text>
  <text x="80" y="378" font-family="Manrope, Arial, sans-serif" font-size="16" fill="#64706B">Create your team account once. Supabase Auth handles the password,</text>
  <text x="80" y="402" font-family="Manrope, Arial, sans-serif" font-size="16" fill="#64706B">the session, and the recovery email.</text>

  <g transform="translate(80 462)">
    <circle cx="16" cy="16" r="16" fill="#DCFCE7"/>
    <text x="16" y="21" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#166534">01</text>
    <text x="48" y="13" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2321">Start with your team email</text>
    <text x="48" y="35" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#64706B">A short form, then the landing page is ready for you.</text>
  </g>
  <g transform="translate(80 532)">
    <circle cx="16" cy="16" r="16" fill="#DCFCE7"/>
    <text x="16" y="21" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#166534">02</text>
    <text x="48" y="13" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2321">Role defaults for development</text>
    <text x="48" y="35" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#64706B">New local accounts can try every Sprint 1 screen.</text>
  </g>
  <g transform="translate(80 602)">
    <circle cx="16" cy="16" r="16" fill="#DCFCE7"/>
    <text x="16" y="21" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#166534">03</text>
    <text x="48" y="13" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2321">Clear duplicate-email handling</text>
    <text x="48" y="35" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#64706B">No stack traces, no guessing, no password stored by us.</text>
  </g>

  <g transform="translate(80 724)">
    <path d="M0 0H42" stroke="#1C2321" stroke-opacity="0.2"/>
    <text x="56" y="5" font-family="Manrope, Arial, sans-serif" font-size="11" fill="#64706B">Built by the Lucky Patcher team</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="748" y="58" width="456" height="684" rx="32" fill="#FFFDF8" stroke="#1C2321" stroke-opacity="0.12"/>
  </g>
  <text x="792" y="112" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2.6" fill="#166534">JOIN THE TEAM</text>
  <text x="790" y="162" font-family="Fraunces, Georgia, serif" font-size="33" font-weight="600" fill="#1C2321">Create your account</text>
  <text x="792" y="198" font-family="Manrope, Arial, sans-serif" font-size="13.5" fill="#64706B">Register with your email and a password. In development, new</text>
  <text x="792" y="218" font-family="Manrope, Arial, sans-serif" font-size="13.5" fill="#64706B">accounts receive the superadmin role so the team can test.</text>

  <text x="792" y="262" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#1C2321">Display name</text>
  <text x="1160" y="262" text-anchor="end" font-family="Manrope, Arial, sans-serif" font-size="11" fill="#64706B">Optional</text>
  <rect x="792" y="280" width="368" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.78" stroke="#1C2321" stroke-opacity="0.12"/>
  <text x="812" y="309" font-family="Manrope, Arial, sans-serif" font-size="13.5" fill="#9AA39F">Alex Campita</text>

  <text x="792" y="358" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#1C2321">Email</text>
  <rect x="792" y="376" width="368" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.78" stroke="#1C2321" stroke-opacity="0.12"/>
  <text x="812" y="405" font-family="Manrope, Arial, sans-serif" font-size="13.5" fill="#9AA39F">you@team.com</text>

  <text x="792" y="454" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#1C2321">Password</text>
  <text x="1160" y="454" text-anchor="end" font-family="Manrope, Arial, sans-serif" font-size="11" fill="#64706B">At least 6 characters</text>
  <rect x="792" y="472" width="368" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.78" stroke="#1C2321" stroke-opacity="0.12"/>
  <g fill="#1C2321" fill-opacity="0.22">
    <circle cx="812" cy="496" r="2.5"/><circle cx="822" cy="496" r="2.5"/><circle cx="832" cy="496" r="2.5"/><circle cx="842" cy="496" r="2.5"/><circle cx="852" cy="496" r="2.5"/><circle cx="862" cy="496" r="2.5"/>
  </g>

  <rect x="792" y="552" width="368" height="52" rx="26" fill="#166534"/>
  <text x="976" y="584" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Create account</text>

  <path d="M792 638H1160" stroke="#1C2321" stroke-opacity="0.1"/>
  <text x="976" y="670" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#64706B">Already have an account? <tspan font-weight="800" fill="#166534">Sign in</tspan></text>

  <g transform="translate(1094 96)">
    <rect width="86" height="28" rx="14" fill="#DCFCE7"/>
    <text x="43" y="18" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1.2" fill="#166534">NEW USER</text>
  </g>
</svg>
