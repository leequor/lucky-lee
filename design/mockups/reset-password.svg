<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Lucky Patcher reset password mockup</title>
  <desc id="desc">Final set-a-new-password design with two password fields and a clear recovery note.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1C2321" stroke-opacity="0.055"/>
    </pattern>
    <filter id="cardShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1C2321" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#BBF7D0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#BBF7D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFEDD5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFEDD5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#F7F3EA"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <circle cx="180" cy="150" r="230" fill="url(#glowGreen)"/>
  <circle cx="1130" cy="720" r="260" fill="url(#glowCoral)"/>

  <g transform="translate(80 62)">
    <rect width="44" height="44" rx="14" fill="#14532D"/>
    <g fill="#DCFCE7">
      <circle cx="15" cy="15" r="7"/>
      <circle cx="29" cy="15" r="7"/>
      <circle cx="15" cy="29" r="7"/>
      <circle cx="29" cy="29" r="7"/>
    </g>
    <path d="M22 22V38" stroke="#166534" stroke-width="2.4" stroke-linecap="round"/>
    <text x="58" y="29" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="600" fill="#1C2321">Lucky Patcher</text>
  </g>

  <text x="80" y="194" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#166534">SPRINT 1 / ACCOUNT ACCESS</text>
  <text x="78" y="270" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="600" fill="#1C2321">A calmer way to</text>
  <text x="78" y="330" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="600" fill="#1C2321">get everyone in.</text>
  <text x="80" y="378" font-family="Manrope, Arial, sans-serif" font-size="16" fill="#64706B">A single-use recovery link, a clear new-password form, and a</text>
  <text x="80" y="402" font-family="Manrope, Arial, sans-serif" font-size="16" fill="#64706B">friendly way back to sign in when the link has expired.</text>

  <g transform="translate(80 462)">
    <circle cx="16" cy="16" r="16" fill="#DCFCE7"/>
    <text x="16" y="21" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#166534">01</text>
    <text x="48" y="13" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2321">Supabase owns the token</text>
    <text x="48" y="35" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#64706B">No custom reset-token table to keep safe.</text>
  </g>
  <g transform="translate(80 532)">
    <circle cx="16" cy="16" r="16" fill="#DCFCE7"/>
    <text x="16" y="21" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#166534">02</text>
    <text x="48" y="13" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2321">One-time links only</text>
    <text x="48" y="35" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#64706B">A used or expired link gets a fresh request path.</text>
  </g>
  <g transform="translate(80 602)">
    <circle cx="16" cy="16" r="16" fill="#DCFCE7"/>
    <text x="16" y="21" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#166534">03</text>
    <text x="48" y="13" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2321">No password echo</text>
    <text x="48" y="35" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#64706B">The new password is sent to Supabase, not stored by us.</text>
  </g>

  <g transform="translate(80 724)">
    <path d="M0 0H42" stroke="#1C2321" stroke-opacity="0.2"/>
    <text x="56" y="5" font-family="Manrope, Arial, sans-serif" font-size="11" fill="#64706B">Built by the Lucky Patcher team</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="748" y="84" width="456" height="632" rx="32" fill="#FFFDF8" stroke="#1C2321" stroke-opacity="0.12"/>
  </g>
  <text x="792" y="140" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2.6" fill="#166534">ALMOST THERE</text>
  <text x="790" y="192" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" fill="#1C2321">Set a new password</text>
  <text x="792" y="228" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#64706B">Choose a new password for your account. You will sign in</text>
  <text x="792" y="250" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#64706B">with it on the next screen.</text>

  <rect x="792" y="280" width="368" height="64" rx="16" fill="#F0FDF4" stroke="#166534" stroke-opacity="0.12"/>
  <path d="M812 304L818 310L828 298" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="842" y="304" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532D">Recovery session verified</text>
  <text x="842" y="322" font-family="Manrope, Arial, sans-serif" font-size="11" fill="#166534">The link is valid and ready to use once.</text>

  <text x="792" y="384" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#1C2321">New password</text>
  <text x="1160" y="384" text-anchor="end" font-family="Manrope, Arial, sans-serif" font-size="11" fill="#64706B">At least 6 characters</text>
  <rect x="792" y="402" width="368" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.78" stroke="#1C2321" stroke-opacity="0.12"/>
  <g fill="#1C2321" fill-opacity="0.22">
    <circle cx="812" cy="426" r="2.5"/><circle cx="822" cy="426" r="2.5"/><circle cx="832" cy="426" r="2.5"/><circle cx="842" cy="426" r="2.5"/><circle cx="852" cy="426" r="2.5"/><circle cx="862" cy="426" r="2.5"/>
  </g>

  <text x="792" y="488" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#1C2321">Confirm new password</text>
  <rect x="792" y="506" width="368" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.78" stroke="#1C2321" stroke-opacity="0.12"/>
  <g fill="#1C2321" fill-opacity="0.22">
    <circle cx="812" cy="530" r="2.5"/><circle cx="822" cy="530" r="2.5"/><circle cx="832" cy="530" r="2.5"/><circle cx="842" cy="530" r="2.5"/><circle cx="852" cy="530" r="2.5"/><circle cx="862" cy="530" r="2.5"/>
  </g>

  <rect x="792" y="578" width="368" height="52" rx="26" fill="#166534"/>
  <text x="976" y="610" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Update password</text>

  <path d="M792 660H1160" stroke="#1C2321" stroke-opacity="0.1"/>
  <text x="976" y="690" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#64706B">Need to start over? <tspan font-weight="800" fill="#166534">Request another link</tspan></text>
</svg>
