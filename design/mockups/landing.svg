  <text x="80" y="778" font-family="Manrope, Arial, sans-serif" font-size="10" fill="#64706B">Lucky Patcher · Sprint 1 · 2026</text>
  <text x="1200" y="778" text-anchor="end" font-family="Manrope, Arial, sans-serif" font-size="10" fill="#64706B">Signed in · <tspan font-weight="700" fill="#166534">system status</tspan></text>
