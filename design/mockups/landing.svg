<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Lucky Patcher landing page mockup</title>
  <desc id="desc">Final protected landing page with a dark clover welcome panel, account card, sprint checklist, and presentation shortcuts.</desc>
  <defs>
